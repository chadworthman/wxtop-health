# GitHub switches off scheduled workflows in a public repository after 60 days without activity.
# Once a month, switch the health check's schedule (back) on, so it never stops quietly.
name: keepalive
on:
  schedule:
    - cron: "41 6 1 * *"
  workflow_dispatch:
permissions:
  actions: write
jobs:
  enable:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Keep the health check's schedule on
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/health.yml/enable" && echo "health.yml enabled"
